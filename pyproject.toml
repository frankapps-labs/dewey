[build-system]
# Exact, cooled build backends. Keep these equal to dependency-groups.build;
# release and CI builds run without isolation from that admitted lock.
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dewey"
version = "0.7.0"
description = "Guaranteed task delivery for Python on Postgres: durable tasks, schedules and a worker, no broker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Frankapps", email = "hello@frankapps.com"}
]
keywords = [
    "task", "queue", "ledger", "guaranteed-delivery", "worker", "scheduler", "cron",
    "postgres", "sqlalchemy", "django",
    "dead-letter", "retry", "backoff",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]

[project.scripts]
dewey = "dewey.cli:main"

[project.optional-dependencies]
sqlalchemy = [
    # [asyncio] brings greenlet, which SQLAlchemy 2.1 no longer installs by default
    # and which importing dewey.sqlalchemy needs.
    "sqlalchemy[asyncio]>=2.0",
]
async = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
]
django = [
    "Django>=5.2.17,<7",
]
otel = [
    # The worker opens one span per attempt through the API only; the application
    # brings the SDK or vendor distribution (Logfire, Sentry) that exports them.
    "opentelemetry-api>=1.20",
]

[dependency-groups]
admission = [
    "PyYAML==6.0.3",
]
build = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
]
release = [
    "setuptools==83.0.0",
    "wheel==0.47.0",
    "twine==7.0.0",
]
audit = [
    "pip-audit==2.10.1",
    # Cooled transitive ceilings keep the scanner graph outside the seven-day
    # window as of 2026-08-13.
    "cyclonedx-python-lib==11.11.0",
    "platformdirs==4.11.0",
]
wheel-smoke = [
    "psycopg2-binary==2.9.12",
]
compat-py311-django52 = [
    "Django==5.2.19; python_version == '3.11'",
]
compat-py312-django52 = [
    "Django==5.2.19; python_version == '3.12'",
]
compat-py312-django60 = [
    "Django==6.0.10; python_version == '3.12'",
]
compat-py313-django60 = [
    "Django==6.0.10; python_version == '3.13'",
]
compat-py314-django60 = [
    "Django==6.0.10; python_version == '3.14'",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.1",
    "pytest-django>=4.5",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.1.0",
    "basedpyright>=1.31.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.21.0",
    # Django 5.2 LTS is supported on every compatible Python; resolvers may select
    # Django 6 on Python 3.12+ when the consuming application does not constrain it.
    "Django>=5.2.17,<7",
    "psycopg2-binary>=2.9",
    "PyYAML==6.0.3",
    # The tracing tests export spans through the SDK's in-memory exporter.
    "opentelemetry-sdk>=1.20",
]

[project.urls]
Homepage = "https://github.com/frankapps-labs/dewey"
Documentation = "https://github.com/frankapps-labs/dewey"
Repository = "https://github.com/frankapps-labs/dewey"
"Bug Tracker" = "https://github.com/frankapps-labs/dewey/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dewey.dashboard" = ["assets/*.js", "assets/*.css", "assets/*.txt"]
"dewey.django" = ["templates/dewey/*.html"]

[tool.dependency-admission]
project-package = "dewey"
build-group = "build"
parser-group = "admission"
cooldown-days = 7
hotfix-label = "dependency-hotfix"
uv-version = "0.10.12"

[tool.uv]
conflicts = [[
    {group = "compat-py311-django52"},
    {group = "compat-py312-django52"},
    {group = "compat-py312-django60"},
    {group = "compat-py313-django60"},
    {group = "compat-py314-django60"},
]]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov=dewey --cov-report=term-missing"
DJANGO_SETTINGS_MODULE = "tests.django_settings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Django writes migrations; we do not hand-format them.
"src/dewey/django/migrations/*.py" = ["E501", "I001"]

[tool.ruff.lint.isort]
known-first-party = ["dewey"]

[tool.basedpyright]
pythonVersion = "3.11"
include = ["src/dewey"]
exclude = ["**/__pycache__", "build", "dist"]
typeCheckingMode = "standard"

# Django ORM is intractable to type-check without django-stubs (and even then it's noisy):
# `.objects`, `.DoesNotExist`, model field class-attributes as defaults, etc.
# We type-check core/sqlalchemy/adapters strictly and treat src/dewey/django as opaque.
# Consumers' own Django code is unaffected — this only applies to Dewey's internals.
[[tool.basedpyright.executionEnvironments]]
root = "src/dewey/django"
reportAttributeAccessIssue = "none"
reportArgumentType = "none"
reportAssignmentType = "none"
reportGeneralTypeIssues = "none"
