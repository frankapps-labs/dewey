# Test infrastructure for Dewey's own suite: one Postgres. Nothing here is needed to
# *use* Dewey — a consumer brings its own Postgres.
#
#   make up        start it, wait until healthy
#   make test-all  run the suite against them
#   make down      stop and remove volumes
#
# The port is offset from the default so this cannot collide with a Postgres you
# already run locally.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dewey_test
    ports:
      - "55440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dewey_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      # The test database is disposable; keeping it in RAM makes the suite quicker
      # and leaves nothing behind.
      - /var/lib/postgresql/data
