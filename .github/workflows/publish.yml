name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Validate admitted release inputs
        run: |
          python scripts/dependency_admission.py --preflight --base-ref HEAD^
          ./scripts/sync_admitted_env.sh .admission-venv 3.12 group:admission
          .admission-venv/bin/python scripts/dependency_admission.py --base-ref HEAD^
          uv lock --check

      - name: Build from admitted backends without isolation
        run: |
          ./scripts/sync_admitted_env.sh .release-venv 3.12 group:release
          VIRTUAL_ENV=.release-venv uv build --no-build-isolation
          .release-venv/bin/twine check dist/*

      - name: Upload immutable distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      # This job receives OIDC but never checks out source, installs dependencies,
      # or builds. It only downloads the artifact produced by the unprivileged job.
      - name: Download admitted distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
