name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Dewey's suite talks to a real Postgres on purpose: FOR UPDATE SKIP LOCKED,
  # partial indexes, LISTEN/NOTIFY and committed claims cannot be proven otherwise.
  DEWEY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dewey_test
  DEWEY_TEST_DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/dewey_test
  DEWEY_TEST_REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django-version: [""]
        huey-version: [""]
        include:
          # The oldest and newest supported Django, pinned explicitly. Without this
          # the matrix only ever tests whatever the resolver picks.
          - python-version: "3.12"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "5.1"
          # The oldest supported Huey. pyproject says >=2.5, so prove it.
          - python-version: "3.12"
            huey-version: "2.5"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Pin Django ${{ matrix.django-version }}
        if: matrix.django-version != ''
        run: uv pip install "Django~=${{ matrix.django-version }}.0"

      - name: Pin Huey ${{ matrix.huey-version }}
        if: matrix.huey-version != ''
        run: uv pip install "huey~=${{ matrix.huey-version }}.0"

      - name: Report the versions actually under test
        run: |
          uv run python -c "import django, sys; print('python', sys.version)"
          uv run python -c "import django; print('django', django.get_version())"
          uv run python -c "import huey; print('huey', huey.__version__)"

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run format check
        run: uv run ruff format --check src/ tests/

      - name: Run typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=dewey --cov-report=lcov

      - name: Check Coveralls availability
        id: coveralls_check
        run: curl -sf --max-time 10 https://coveralls.io > /dev/null && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Upload to Coveralls
        if: steps.coveralls_check.outputs.available == 'true'
        uses: coverallsapp/github-action@v2
        with:
          file: coverage.lcov

  wheel-smoke:
    # Builds the wheel, installs it into a clean virtualenv, and runs the full
    # producer -> dispatcher -> Huey worker path against real Postgres and Redis.
    # This is what catches packaging mistakes the in-repo suite cannot see.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Build the wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Inspect wheel contents
        run: |
          python -m zipfile -l dist/*.whl

      - name: Run the installed-wheel smoke test
        run: ./scripts/wheel_smoke.sh

  audit:
    # pip-audit cannot build its temp venv on some dev machines (ensurepip aborts), so
    # the audit lives here where the environment is predictable. Advisory-only: a new
    # CVE in a transitive dev dependency should surface, not block an unrelated PR.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Export the locked dependency set
        run: uv export --format requirements-txt --no-hashes --no-emit-project > requirements-audit.txt

      - name: Audit dependencies
        run: uvx pip-audit --no-deps -r requirements-audit.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run twine check dist/*
