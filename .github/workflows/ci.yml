name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dewey's suite talks to real services because locking and delivery semantics
  # cannot be proven against SQLite or mocks.
  DEWEY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dewey_test
  DEWEY_TEST_DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/dewey_test
  DEWEY_TEST_REDIS_URL: redis://localhost:6379/0

jobs:
  checks:
    name: Static checks
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Install admitted static-analysis dependencies
        run: uv sync --locked --all-extras --dev --no-install-project

      - name: Run linting
        run: .venv/bin/ruff check src/ scripts/dependency_admission.py tests/

      - name: Run format check
        run: .venv/bin/ruff format --check src/ scripts/dependency_admission.py tests/

      - name: Run typecheck
        run: .venv/bin/basedpyright

  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.compatibility-group }})
    needs: audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # One intentional lane per supported Python version, plus a Python 3.12
          # Django 5.2 lane guarding the oldest-Django/newer-Python resolver seam.
          # Every lane upgrades within Huey 3.x, so CI tracks its latest release.
          - python-version: "3.11"
            compatibility-group: "compat-py311-django52"
            expected-django: "5.2.16"
            expected-huey: "3.0.0"
            upload-coverage: false
          - python-version: "3.12"
            compatibility-group: "compat-py312-django52"
            expected-django: "5.2.16"
            expected-huey: "3.0.0"
            upload-coverage: false
          - python-version: "3.12"
            compatibility-group: "compat-py312-django60"
            expected-django: "6.0.7"
            expected-huey: "3.0.0"
            upload-coverage: true
          - python-version: "3.13"
            compatibility-group: "compat-py313-django60"
            expected-django: "6.0.7"
            expected-huey: "3.0.0"
            upload-coverage: false
          - python-version: "3.14"
            compatibility-group: "compat-py314-django60"
            expected-django: "6.0.7"
            expected-huey: "3.0.0"
            upload-coverage: false

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Create hash-locked compatibility environment
        run: |
          ./scripts/sync_admitted_env.sh .compat-venv "${{ matrix.python-version }}" \
            group:dev "group:${{ matrix.compatibility-group }}"

      - name: Verify compatibility requirements
        run: |
          .compat-venv/bin/python - <<'PY'
          from importlib.metadata import version

          assert version("Django") == "${{ matrix.expected-django }}"
          assert version("huey") == "${{ matrix.expected-huey }}"
          print("Django", version("Django"), "Huey", version("huey"))
          PY

      - name: Run tests
        if: matrix.upload-coverage == false
        run: .compat-venv/bin/pytest

      - name: Run tests and generate Coveralls report
        if: matrix.upload-coverage == true
        run: .compat-venv/bin/pytest --cov=dewey --cov-report=lcov

      - name: Check Coveralls availability
        if: matrix.upload-coverage == true
        id: coveralls_check
        run: curl -sf --max-time 10 https://coveralls.io > /dev/null && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Upload to Coveralls
        if: matrix.upload-coverage == true && steps.coveralls_check.outputs.available == 'true'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: coverage.lcov

  wheel-smoke:
    name: Installed-wheel smoke
    needs: audit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      - name: Build and check package from admitted release tools
        run: |
          ./scripts/sync_admitted_env.sh .release-venv 3.12 group:release
          VIRTUAL_ENV=.release-venv uv build --no-build-isolation
          .release-venv/bin/twine check dist/*

      - name: Inspect wheel contents
        run: python -m zipfile -l dist/*.whl

      - name: Run the optional-extra import matrix
        run: ./scripts/optional_import_matrix.sh

      - name: Run the installed-wheel smoke test
        run: ./scripts/wheel_smoke.sh

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.10.12"

      # Runs before dependency sync in this job. The checker uses only Python's
      # standard library, so it can reject unadmitted sources and missing hashes
      # without importing newly selected dependency code.
      - name: Validate dependency admission
        env:
          DEWEY_ADMISSION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEWEY_ENFORCE_COOLDOWN: ${{ github.event_name == 'pull_request' }}
        run: |
          args=(--base-ref "$DEWEY_ADMISSION_BASE")
          if [[ "$DEWEY_ENFORCE_COOLDOWN" == "true" ]]; then
            args+=(--enforce-cooldown)
          fi
          python scripts/dependency_admission.py "${args[@]}"
          uv lock --check

      - name: Export locked dependency sets
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-emit-project \
            --no-dev --all-extras > requirements-runtime.txt
          uv export --locked --format requirements-txt --no-hashes --no-emit-project \
            --only-dev > requirements-dev-audit.txt

      # Blocking: markers split the runtime graph across the oldest and newest
      # Python/Django lines, so audit both interpreter contexts.
      - name: Audit runtime dependencies
        run: |
          ./scripts/sync_admitted_env.sh .audit-py311 3.11 group:audit
          ./scripts/sync_admitted_env.sh .audit-py314 3.14 group:audit
          .audit-py311/bin/pip-audit --no-deps --disable-pip -r requirements-runtime.txt
          .audit-py314/bin/pip-audit --no-deps --disable-pip -r requirements-runtime.txt

      # Tooling is not shipped to users. Surface advisories without blocking an
      # unrelated product patch.
      - name: Audit development tooling
        continue-on-error: true
        run: .audit-py314/bin/pip-audit --no-deps --disable-pip -r requirements-dev-audit.txt
