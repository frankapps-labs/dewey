name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI only reads the repository. Fork pull requests already run every job below
# with a read-only token, so nothing here needs more than that.
permissions:
  contents: read

env:
  # Dewey's suite talks to a real Postgres on purpose: FOR UPDATE SKIP LOCKED,
  # partial indexes, LISTEN/NOTIFY and committed claims cannot be proven otherwise.
  DEWEY_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dewey_test
  DEWEY_TEST_DATABASE_URL_ASYNC: postgresql+asyncpg://postgres:postgres@localhost:5432/dewey_test
  DEWEY_TEST_REDIS_URL: redis://localhost:6379/0

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Compatibility pins are installed after the locked sync. Prevent later
      # `uv run` commands from silently restoring the lockfile versions.
      UV_NO_SYNC: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        django-spec: [""]
        huey-version: [""]
        include:
          # Django 5.2 is the supported floor/LTS and the only Django line that
          # supports Python 3.11. Django 6 requires Python 3.12+.
          - python-version: "3.11"
            django-spec: "Django~=5.2.0"
          - python-version: "3.12"
            django-spec: "Django~=5.2.0"
          - python-version: "3.12"
            django-spec: "Django>=6,<7"
          - python-version: "3.13"
            django-spec: "Django>=6,<7"
          # The oldest supported Huey. pyproject says >=2.5, so prove it.
          - python-version: "3.12"
            huey-version: "2.5"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Pin ${{ matrix.django-spec }}
        if: matrix.django-spec != ''
        run: uv pip install --upgrade "${{ matrix.django-spec }}"

      - name: Pin Huey ${{ matrix.huey-version }}
        if: matrix.huey-version != ''
        run: uv pip install "huey~=${{ matrix.huey-version }}.0"

      - name: Report the versions actually under test
        run: |
          uv run python -c "import sys; print('python', sys.version)"
          uv run python -c "import django; print('django', django.get_version())"
          uv run python -c "import huey; print('huey', huey.__version__)"

      - name: Verify the requested Django pin survived
        if: matrix.django-spec != ''
        run: uv run python -c "import django; from packaging.specifiers import SpecifierSet; assert django.get_version() in SpecifierSet('${{ matrix.django-spec }}'), django.get_version()"

      - name: Verify the requested Huey pin survived
        if: matrix.huey-version != ''
        run: uv run python -c "import huey; assert huey.__version__.startswith('${{ matrix.huey-version }}.'), huey.__version__"

      - name: Run linting
        run: uv run ruff check src/ tests/

      - name: Run format check
        run: uv run ruff format --check src/ tests/

      - name: Run typecheck
        run: uv run basedpyright

      - name: Run tests
        run: uv run pytest

  coverage:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests with coverage
        run: uv run pytest --cov=dewey --cov-report=lcov

      - name: Check Coveralls availability
        id: coveralls_check
        run: curl -sf --max-time 10 https://coveralls.io > /dev/null && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"

      - name: Upload to Coveralls
        if: steps.coveralls_check.outputs.available == 'true'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2
        with:
          file: coverage.lcov

  wheel-smoke:
    # Builds the wheel, installs it into a clean virtualenv, and runs the full
    # producer -> dispatcher -> Huey worker path against real Postgres and Redis.
    # This is what catches packaging mistakes the in-repo suite cannot see.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dewey_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Build the wheel
        run: uv build

      - name: Check package metadata
        run: uvx twine check dist/*

      - name: Inspect wheel contents
        run: |
          python -m zipfile -l dist/*.whl

      - name: Run the optional-extra import matrix
        run: ./scripts/optional_import_matrix.sh

      - name: Run the installed-wheel smoke test
        run: ./scripts/wheel_smoke.sh

  audit-runtime:
    # BLOCKING. These are the packages a `pip install dewey[...]` actually puts in a
    # user's environment, so a known advisory here is a shipped vulnerability, not
    # housekeeping. Scope comes from a separate export (`--no-dev --all-extras`)
    # rather than from filtering a combined report, so the blocking set is defined
    # by the lockfile instead of by a grep that silently stops matching.
    #
    # The matrix is about environment markers, not about testing Python itself. The
    # exported runtime graph is marker-split (Django 5.2 below 3.12, Django 6.0 from
    # 3.12), and a requirements audit run on one interpreter can skip the lines whose
    # markers do not apply to it. Auditing at both ends of requires-python removes
    # that doubt, cheaply.
    name: audit (runtime, blocking)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Export the locked runtime dependency set
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-emit-project \
            --no-dev --all-extras > requirements-runtime.txt
          cat requirements-runtime.txt

      - name: Audit runtime dependencies
        run: uvx --python ${{ matrix.python-version }} pip-audit --no-deps --disable-pip -r requirements-runtime.txt

  audit-dev:
    # ADVISORY. pip-audit cannot build its temp venv on some dev machines (ensurepip
    # aborts), so the audit lives here where the environment is predictable. A new
    # CVE in a linter or a test plugin ships to nobody, so it should surface without
    # blocking an unrelated PR — the runtime half above is the gate.
    name: audit (dev tooling, advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Export the locked dev dependency set
        run: |
          uv export --locked --format requirements-txt --no-hashes --no-emit-project \
            --only-dev > requirements-dev-audit.txt
          cat requirements-dev-audit.txt

      - name: Audit dev dependencies
        run: uvx pip-audit --no-deps --disable-pip -r requirements-dev-audit.txt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7

      - name: Install dependencies
        run: uv sync --locked --all-extras --dev

      - name: Build package
        run: uv build

      - name: Check package metadata
        run: uv run twine check dist/*
